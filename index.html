<style>
:root{--g:#4f7566;--gl:#e4eee8;--bd:#dfe3e1;--m:#6b7773}
body{margin:0;font-family:'Noto Sans Devanagari',sans-serif;background:#f6f7f6;color:#2b3436;padding-bottom:74px}
.top{background:var(--g);color:#fff;padding:14px 16px}.top b{font-size:20px;display:block}.top span{font-size:13px;opacity:.85}
.w{padding:12px}
.card{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}

.chip{color:#fff;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700}
.m{color:var(--m);font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--bd)}

.opt{border:2px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:8px}.opt.on{background:var(--gl);border-color:var(--g)}
.tl{border-left:3px solid var(--bd);margin-left:6px;padding-left:12px}

function ncat(s){var k=String(s||'').toLowerCase().replace(/[\s\-_.]/g,'');var m={uns:'UNs',unskill:'UNs',unskilled:'UNs',अकुशल:'UNs',ss:'SS',semiskill:'SS',semiskilled:'SS',semi:'SS',अर्धकुशल:'SS','अर्द्धकुशल':'SS',s:'S',skill:'S',skilled:'S',कुशल:'S',hs:'HS',highlyskilled:'HS',highlyskill:'HS',अतिकुशल:'HS'};return m[k]||''}
function cd(){var c=cs(CID);if(!c.calc)c.calc={};var k=c.calc,n=new Date(),y=n.getMonth()>=3?n.getFullYear()-1:n.getFullYear()-2;k.mw=k.mw||{from:'',to:'',rows:[]};k.bn=k.bn||{yr:y,rate:'',pct:20,rows:[]};return k}
function mwOne(cat,fr,to,paid){var a=new Date(fr+'T00:00:00'),b=new Date(to+'T00:00:00');if(!cat||isNaN(a)||isNaN(b)||b<a)return{bad:1,arr:0};var y=a.getFullYear(),mo=a.getMonth(),t=0,miss=0;
while(new Date(y,mo,1)<=b){var ms=new Date(y,mo,1),me=new Date(y,mo+1,0),s=a>ms?a:ms,e=b<me?b:me,fr2=(Math.round((e-s)/864e5)+1)/me.getDate(),r=rateAt(cat,iso(ms));if(r==null)miss=1;else t+=Math.max(0,r-(+paid||0))*fr2;mo++;if(mo>11){mo=0;y++}}
return{arr:Math.round(t),miss:miss}}
function bnLbl(k){return k.bn.rate?fd(k.bn.rate)+' की दर':'लेखा वर्ष के 12 माह की औसत दर'}
function bnRate(k,cat){if(k.bn.rate){var e=rts().filter(function(x){return x.from==k.bn.rate})[0];return e&&e[cat]!==''&&e[cat]!=null?+e[cat]:null}var t=0;for(var i=0;i<12;i++){var d=new Date(+k.bn.yr,3+i,1),r=rateAt(cat,iso(d));if(r==null)return null;t+=r}return t/12}
function bnOne(k,r){var rt=r.cat?bnRate(k,r.cat):null;if(rt==null)return{bad:1,wage:0,bonus:0,diff:0};var w=Math.round(rt*(+r.m||0)),b=Math.round(w*(+k.bn.pct)/100);return{wage:w,bonus:b,diff:Math.max(0,b-(+r.paid||0))}}
function calcV(id){CID=id;var c=cs(id),k=cd(),y=window.scrollY;
var tb=function(t,l){return `<button class="${CT==t?'':'s'}" onclick="CT='${t}';calcV('${id}')">${l}</button>`};
var h=`<div class="top"><b>🧮 वेतन / बोनस गणना</b><span>${E(c.inst||c.name)}</span></div><div class="w"><button class="s" onclick="show('case','${id}')">←</button>${tb('mw','लंबित न्यूनतम वेतन')}${tb('bn','बोनस')}${tb('rt','दरें')}`;
if(CT=='rt'){h+=`<div class="card"><b>न्यूनतम वेतन की मासिक दरें</b><div class="m">अप्रैल / अक्टूबर में नई दर आने पर "नई दर जोड़ें" दबाकर उसकी लागू-तिथि और चारों दरें भरें। गणना हर माह की लागू दर से अपने आप होगी।</div><div style="overflow-x:auto"><table style="border-collapse:collapse;font-size:13px;width:100%"><tr><th>लागू तिथि</th><th>अकुशल</th><th>अर्धकुशल</th><th>कुशल</th><th>अतिकुशल</th><th></th></tr>`;
rts().forEach(function(e,i){h+=`<tr><td><input type="date" value="${e.from}" onchange="ru(${i},'from',this.value)"></td>`+CK.map(function(c2){return `<td><input type="number" style="min-width:76px" value="${e[c2]==null?'':e[c2]}" onchange="ru(${i},'${c2}',this.value)"></td>`}).join('')+`<td><button class="r" onclick="rd(${i})">✕</button></td></tr>`});
h+=`</table></div><button onclick="ra()">+ नई दर जोड़ें</button></div></div>`;g('v').innerHTML=h;window.scrollTo(0,y);return}
if(CT=='mw'){var m=k.mw,tot=0,miss=0,bad=0;
h+=`<div class="card"><b>अवधि (सभी श्रमिकों के लिए)</b><div class="g"><div><span class="m">से</span><input type="date" value="${m.from}" onchange="mu('from',this.value)"></div><div><span class="m">तक</span><input type="date" value="${m.to}" onchange="mu('to',this.value)"></div></div><div class="m">"दिया गया वेतन" = श्रमिक को प्रतिमाह वास्तव में दिया गया वेतन।</div></div>`;
h+=`<div class="card"><b>श्रमिक जोड़ें</b><textarea id="ps" rows="3" placeholder="Excel से कॉपी करके चिपकाएं — कॉलम: नाम, श्रेणी (UNs/SS/S/HS), प्रतिमाह दिया गया वेतन"></textarea><button onclick="pasteRows('mw')">चिपकाई सूची जोड़ें</button><button class="s" onclick="addRow('mw')">+ एक श्रमिक</button></div>`;
h+=`<div class="card" style="overflow-x:auto"><table style="border-collapse:collapse;font-size:13px;width:100%"><tr><th>#</th><th>नाम</th><th>श्रेणी</th><th>दिया गया/माह</th><th>देय अंतर ₹</th><th></th></tr>`;
m.rows.forEach(function(r,i){var o=m.from&&m.to?mwOne(r.cat,m.from,m.to,r.paid):{bad:1,arr:0};tot+=o.arr;if(o.miss)miss++;if(o.bad)bad++;
h+=`<tr><td>${i+1}</td><td><input style="min-width:130px" value="${E(r.n).replace(/"/g,'&quot;')}" onchange="ru2('mw',${i},'n',this.value)"></td><td>${catSel('mw',i,r.cat)}</td><td><input type="number" style="min-width:80px" value="${r.paid==null?'':r.paid}" onchange="ru2('mw',${i},'paid',this.value)"></td><td style="text-align:right"><b>${inr(o.arr)}</b></td><td><button class="r" onclick="delRow('mw',${i})">✕</button></td></tr>`});
h+=`<tr><td colspan="4" style="text-align:right"><b>कुल (${m.rows.length} श्रमिक)</b></td><td style="text-align:right"><b>${inr(tot)}</b></td><td></td></tr></table>${miss?'<div class="m" style="color:#b0413e">⚠ कुछ माह की दर "दरें" टैब में नहीं है — पहले दर जोड़ें।</div>':''}${bad&&m.rows.length?'<div class="m" style="color:#b0413e">⚠ अवधि या श्रेणी भरें।</div>':''}</div>`;
h+=`<button onclick="calcPrint('mw')">🖨 रिपोर्ट छापें / PDF</button><button class="s" onclick="calcNote('mw')">📝 जवाब के पश्चात पत्र की "शेष कमी" में जोड़ें</button>`;}
if(CT=='bn'){var b=k.bn,T1=0,T2=0,T3=0,T4=0,yo='';for(var yy=2020;yy<=new Date().getFullYear();yy++)yo+=`<option value="${yy}" ${yy==b.yr?'selected':''}>${yy}-${String(yy+1).slice(2)}</option>`;
var ro='<option value="">स्वतः (वर्ष के 12 माह की औसत दर)</option>'+rts().map(function(e){return `<option value="${e.from}" ${e.from==b.rate?'selected':''}>${fd(e.from)} की दर</option>`}).join('');
var po=[8.33,10,12,15,18,20].map(function(p){return `<option ${p==b.pct?'selected':''}>${p}</option>`}).join('');
h+=`<div class="card"><b>बोनस वर्ष एवं दर</b><div class="g"><div><span class="m">लेखा वर्ष</span><select onchange="bu('yr',this.value)">${yo}</select></div><div><span class="m">बोनस %</span><select onchange="bu('pct',this.value)">${po}</select></div></div><span class="m">वेतन आधार (न्यूनतम वेतन दर)</span><select onchange="bu('rate',this.value)">${ro}</select><div class="m">अभी प्रयुक्त: ${bnLbl(k)} × कार्यरत माह। बोनस की गणना वेतन सीमा (₹7000 या न्यूनतम वेतन, जो अधिक हो) पर होती है, इसलिए न्यूनतम वेतन आधार लिया गया है।</div></div>`;
h+=`<div class="card"><b>कर्मचारी जोड़ें</b><textarea id="ps" rows="3" placeholder="Excel से कॉपी करके चिपकाएं — कॉलम: नाम, श्रेणी (UNs/SS/S/HS), कार्यरत माह, दिया गया बोनस"></textarea><button onclick="pasteRows('bn')">चिपकाई सूची जोड़ें</button><button class="s" onclick="addRow('bn')">+ एक कर्मचारी</button></div>`;
h+=`<div class="card" style="overflow-x:auto"><table style="border-collapse:collapse;font-size:13px;width:100%"><tr><th>#</th><th>नाम</th><th>श्रेणी</th><th>माह</th><th>कुल वेतन</th><th>बोनस</th><th>दिया गया</th><th>अंतर ₹</th><th></th></tr>`;
var bad2=0;b.rows.forEach(function(r,i){var o=bnOne(k,r);if(o.bad)bad2++;T1+=o.wage;T2+=o.bonus;T3+=(+r.paid||0);T4+=o.diff;
h+=`<tr><td>${i+1}</td><td><input style="min-width:130px" value="${E(r.n).replace(/"/g,'&quot;')}" onchange="ru2('bn',${i},'n',this.value)"></td><td>${catSel('bn',i,r.cat)}</td><td><input type="number" style="min-width:50px" value="${r.m==null?'':r.m}" onchange="ru2('bn',${i},'m',this.value)"></td><td style="text-align:right">${inr(o.wage)}</td><td style="text-align:right">${inr(o.bonus)}</td><td><input type="number" style="min-width:70px" value="${r.paid==null?'':r.paid}" onchange="ru2('bn',${i},'paid',this.value)"></td><td style="text-align:right"><b>${inr(o.diff)}</b></td><td><button class="r" onclick="delRow('bn',${i})">✕</button></td></tr>`});
h+=`<tr><td colspan="4" style="text-align:right"><b>कुल (${b.rows.length})</b></td><td style="text-align:right"><b>${inr(T1)}</b></td><td style="text-align:right"><b>${inr(T2)}</b></td><td style="text-align:right"><b>${inr(T3)}</b></td><td style="text-align:right"><b>${inr(T4)}</b></td><td></td></tr></table>${bad2?'<div class="m" style="color:#b0413e">⚠ कुछ पंक्तियों में श्रेणी खाली है या उस तारीख की दर "दरें" टैब में नहीं है।</div>':''}</div>`;
h+=`<button onclick="calcPrint('bn')">🖨 रिपोर्ट छापें / PDF</button><button class="s" onclick="calcNote('bn')">📝 जवाब के पश्चात पत्र की "शेष कमी" में जोड़ें</button>`}
h+='</div>';g('v').innerHTML=h;window.scrollTo(0,y)}
function catSel(t,i,v){return `<select style="min-width:96px" onchange="ru2('${t}',${i},'cat',this.value)"><option value="">चुनें</option>`+CK.map(function(c2){return `<option value="${c2}" ${c2==v?'selected':''}>${CATS[c2]}</option>`}).join('')+'</select>'}
function cdone(){sv();calcV(CID)}
function ru(i,f,v){rts()[i][f]=f=='from'?v:(v===''?'':+v);cdone()}
function rd(i){if(!confirm('यह दर हटाएं?'))return;rts().splice(i,1);cdone()}
function ra(){rts().push({from:T,UNs:'',SS:'',S:'',HS:''});cdone()}
function mu(f,v){cd().mw[f]=v;cdone()}
function bu(f,v){cd().bn[f]=f=='pct'||f=='yr'?+v:v;cdone()}
function ru2(t,i,f,v){var r=cd()[t].rows[i];r[f]=(f=='n'||f=='cat')?v:(v===''?'':+v);cdone()}
function delRow(t,i){cd()[t].rows.splice(i,1);cdone()}
function addRow(t){cd()[t].rows.push(t=='mw'?{n:'',cat:'',paid:''}:{n:'',cat:'',m:12,paid:''});cdone()}
function pasteRows(t){var tx=g('ps').value,need=t=='mw'?3:4,n=0,k=cd();tx.split(/\r?\n/).forEach(function(l){if(!l.trim())return;var p=l.split(/\t|,/).map(function(x){return x.trim()});if(p.length>need&&/^\d+$/.test(p[0]))p.shift();var num=function(x){return +String(x||'').replace(/[^\d.]/g,'')||0};
k[t].rows.push(t=='mw'?{n:p[0]||'',cat:ncat(p[1]),paid:num(p[2])}:{n:p[0]||'',cat:ncat(p[1]),m:num(p[2]),paid:num(p[3])});n++});if(!n){alert('कोई पंक्ति नहीं मिली');return}cdone()}
function calcSum(t){var c=cs(CID),k=cd(),inst=E(c.inst||c.name);
if(t=='mw'){var m=k.mw,tot=0,cnt=0;m.rows.forEach(function(r){var o=mwOne(r.cat,m.from,m.to,r.paid);if(o.arr>0){cnt++;tot+=o.arr}});return{tot:tot,cnt:cnt,all:m.rows.length,line:`निरीक्षण में पाया गया कि दिनांक ${m.from?fd(m.from):'____'} से ${m.to?fd(m.to):'____'} की अवधि में ${cnt} श्रमिकों को न्यूनतम वेतन की निर्धारित दर से कम वेतन का भुगतान किया गया है, जिसकी कुल अंतर राशि रु. ${inr(tot)} है।`}}
var b=k.bn,T4=0,cnt2=0;b.rows.forEach(function(r){var o=bnOne(k,r);if(o.diff>0){cnt2++;T4+=o.diff}});return{tot:T4,cnt:cnt2,all:b.rows.length,line:`लेखा वर्ष ${b.yr}-${String(+b.yr+1).slice(2)} का ${b.pct}% बोनस ${cnt2} कर्मचारियों को देय राशि से कम भुगतान किया गया है, जिसकी कुल अंतर राशि रु. ${inr(T4)} है।`}}
function calcNote(t){var s=calcSum(t),k=cd();k.note=(k.note&&k.note!=''?k.note.split('\n').filter(function(x){return t=='mw'?x.indexOf('न्यूनतम वेतन')<0:x.indexOf('बोनस')<0}).join('\n')+'\n':'')+s.line;k.note=k.note.trim();sv();alert('सहेजा गया। अब "जवाब के बाद पत्र" बनाते समय यह "शेष कमी / आवश्यक सुधार" में अपने आप भर जाएगा।')}
function calcPrint(t){var c=cs(CID),k=cd(),s=calcSum(t),th='style="border:1px solid #000;padding:2px 4px"',tr=function(a,tot){return '<tr>'+a.map(function(x,i){return `<td ${th}${i>0&&x!==''&&!isNaN(String(x).replace(/,/g,''))?' align="right"':''}>${tot?'<b>'+x+'</b>':x}</td>`}).join('')+'</tr>'};
var hd=`<div class="c hd" style="font-size:14pt">${offOf().short}</div><div class="c" style="font-size:12pt;margin:4pt 0 8pt"><b>${t=='mw'?'लंबित न्यूनतम वेतन की गणना':'बोनस भुगतान की गणना'}</b></div><div style="font-size:10pt">संस्थान: <b>${E(c.inst)}</b> &nbsp; नियोजक: ${E(c.name)}<br>${t=='mw'?'अवधि: '+(k.mw.from?fd(k.mw.from):'')+' से '+(k.mw.to?fd(k.mw.to):''):'लेखा वर्ष: '+k.bn.yr+'-'+String(+k.bn.yr+1).slice(2)+' · बोनस '+k.bn.pct+'% · दर: '+bnLbl(k)+' (न्यूनतम वेतन)'}</div>`,body='';
if(t=='mw'){var m=k.mw,tot=0;body='<tr>'+['क्र.','श्रमिक का नाम','श्रेणी','प्रतिमाह दिया गया वेतन','देय अंतर राशि'].map(function(x){return `<th ${th}>${x}</th>`}).join('')+'</tr>';m.rows.forEach(function(r,i){var o=mwOne(r.cat,m.from,m.to,r.paid);tot+=o.arr;body+=tr([i+1,E(r.n),r.cat,inr(r.paid),inr(o.arr)])});body+=tr(['','कुल','','',inr(tot)],1)}
else{var b=k.bn,a1=0,a2=0,a3=0,a4=0;body='<tr>'+['क्र.','कर्मचारी का नाम','श्रेणी','माह','कुल वेतन','बोनस ('+b.pct+'%)','दिया गया बोनस','अंतर राशि'].map(function(x){return `<th ${th}>${x}</th>`}).join('')+'</tr>';b.rows.forEach(function(r,i){var o=bnOne(k,r);a1+=o.wage;a2+=o.bonus;a3+=(+r.paid||0);a4+=o.diff;body+=tr([i+1,E(r.n),r.cat,r.m,inr(o.wage),inr(o.bonus),inr(r.paid),inr(o.diff)])});body+=tr(['','कुल','','',inr(a1),inr(a2),inr(a3),inr(a4)],1)}
pr([hd+`<table style="border-collapse:collapse;width:100%;font-size:9pt;margin-top:8pt;line-height:1.25">${body}</table><div style="font-size:10pt;margin-top:8pt">${s.line}</div>`])}

</script></body></html>
