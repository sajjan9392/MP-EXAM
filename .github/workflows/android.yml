# MP Exam — Android build (GitHub Actions)
name: Build Android App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: "1.0.${{ github.run_number }}"
      VERSION_CODE: ${{ github.run_number }}
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Assemble www folder (always fresh)
        run: |
          set -e
          rm -rf www && mkdir -p www
          if [ ! -f index.html ]; then echo "::error::index.html repo me nahi mila"; ls; exit 1; fi
          if [ ! -f qindex.json ]; then echo "::error::qindex.json nahi mila - latest zip ki saari files upload karo"; ls; exit 1; fi
          cp index.html qindex.json www/
          for f in $(python3 -c "import json;print(' '.join(json.load(open('qindex.json'))['files']))"); do
            if [ ! -f "$f" ]; then echo "::error::$f nahi mila - zip ki ye file bhi upload karo"; exit 1; fi
            cp "$f" www/
          done
          cp manifest.json sw.js privacy.html ca.json www/ 2>/dev/null || true
          cp icon-*.png maskable-*.png www/ 2>/dev/null || true
          echo "Questions in this build:"; python3 -c "import json;print(json.load(open('qindex.json'))['total'])"
          ls -la www

      - name: Create Capacitor config
        run: |
          cat > package.json <<'EOF'
          {
            "name": "mp-exam", "version": "1.0.0", "private": true,
            "dependencies": { "@capacitor/android": "^6.1.2", "@capacitor/core": "^6.1.2", "@capacitor/app": "^6.0.1" },
            "devDependencies": { "@capacitor/cli": "^6.1.2" }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "in.mpexam.app",
            "appName": "MP Exam",
            "webDir": "www",
            "android": { "backgroundColor": "#0D2B7E", "allowMixedContent": false },
            "server": { "androidScheme": "https" }
          }
          EOF

      - name: Install Capacitor
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: App icons
        run: |
          RES=android/app/src/main/res
          for d in mdpi hdpi; do for n in ic_launcher ic_launcher_round ic_launcher_foreground; do cp www/icon-72.png $RES/mipmap-$d/$n.png; done; done
          for n in ic_launcher ic_launcher_round ic_launcher_foreground; do cp www/icon-96.png $RES/mipmap-xhdpi/$n.png; cp www/icon-144.png $RES/mipmap-xxhdpi/$n.png; cp www/icon-192.png $RES/mipmap-xxxhdpi/$n.png; done

      - name: Version + signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import os, re
          p='android/app/build.gradle'; s=open(p).read()
          s=re.sub(r'versionCode\s+\d+', 'versionCode '+os.environ['VERSION_CODE'], s)
          s=re.sub(r'versionName\s+"[^"]*"', 'versionName "'+os.environ['VERSION_NAME']+'"', s)
          if os.path.exists('debug.keystore'):
              dbg='''    signingConfigs {
                  debug {
                      storeFile file("../../debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          '''
              s=s.replace('android {\n', 'android {\n'+dbg, 1)
          if os.environ.get('KEYSTORE_BASE64'):
              sc='''    signingConfigs {
                  release {
                      storeFile file("release.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
          '''
              if 'signingConfigs {' in s:
                  rel='''        release {
                      storeFile file("release.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
          '''
                  s=s.replace('    signingConfigs {\n', '    signingConfigs {\n'+rel, 1)
              else:
                  s=s.replace('android {\n', 'android {\n'+sc, 1)
              s=re.sub(r'(buildTypes\s*\{\s*release\s*\{)', r'\1\n            signingConfig signingConfigs.release', s, 1)
          open(p,'w').write(s)
          PY
          if [ -n "$KEYSTORE_BASE64" ]; then echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks; fi

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Build signed release (AAB + APK)
        if: ${{ env.HAS_KEY == 'true' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        working-directory: android
        run: ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mp-exam-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release AAB + APK
        if: ${{ env.HAS_KEY == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: mp-exam-release
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
