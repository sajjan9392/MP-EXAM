<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>कारण बताओ सूचना पत्र जनरेटर</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#5b6570;--bd:#d5dae0;--ac:#4f7566;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171b;--card:#1d2127;--tx:#e8eaed;--mu:#9aa3ad;--bd:#343b44;--ac:#8fb8a4}}
:root[data-theme="dark"]{--bg:#14171b;--card:#1d2127;--tx:#e8eaed;--mu:#9aa3ad;--bd:#343b44;--ac:#6ea0ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Noto Sans Devanagari',system-ui,sans-serif;font-size:15px}
.w{max-width:760px;margin:0 auto;padding:14px}
h1{font-size:19px;margin:6px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:60px}
.r{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ck{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:14px}
.ck input{width:auto}
.b{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
button{flex:1;padding:11px;border:0;border-radius:8px;background:var(--ac);color:#fff;font:inherit;font-weight:700}
button.s{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
#p{width:210mm;min-height:297mm;box-sizing:border-box;background:#fff;color:#000;border:1px solid var(--bd);padding:20mm;font-size:14pt;line-height:1.5;transform-origin:top left;position:relative}#p p{orphans:2;widows:2}#pw{overflow:hidden}
#p .c{text-align:center}#p .hd{font-weight:700;font-size:1em}#p .of{font-weight:700;font-size:21pt;line-height:1.3}#p .ad{font-size:8pt;line-height:1.4}#p img{height:56pt}
#p .rt{display:flex;justify-content:space-between;gap:8px}
#p .sg{text-align:right;font-weight:700;margin-top:34px}
body.app #p{position:absolute;left:-10000px;top:0;visibility:hidden}body.app .b{display:none}
#bv{display:none}body.bm .w{display:none}body.bm #bv{display:block;padding:10px 0 150px}
#bv .sh{width:210mm;box-sizing:border-box;min-height:297mm;background:#fff;color:#000;padding:20mm;margin:0 auto 14px;position:relative;font-size:14pt;line-height:1.5;border:1px solid #d5dae0;transform-origin:top left}
#bv .c{text-align:center}#bv .hd{font-weight:700;font-size:1em}#bv .of{font-weight:700;font-size:21pt;line-height:1.3}#bv .ad{font-size:8pt;line-height:1.4}#bv img{height:56pt}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:8px;display:none}body.bm #bar{display:block}
@page{size:A4;margin:0}@media print{body.bm #bar{display:none}body.bm #p{display:none}body.bm *{visibility:visible}body.bm #bv{display:block!important;position:absolute;left:0;top:0;width:100%;padding:0}body.bm #bv .sh{border:0;margin:0;width:100%;zoom:1!important}body.bm #bv .sh+.sh{page-break-before:always}body.bm{padding:0!important;margin:0!important}body{background:#fff!important}body *{visibility:hidden}#p,#p *{visibility:visible}#p{position:absolute;left:0;top:0;width:100%;min-height:0;border:0;zoom:1!important}}
</style></head><body><div class="w">
<h1>📄 कारण बताओ सूचना पत्र जनरेटर</h1>
<div class="card">
<label>अधिनियम</label><select id="act"></select><div id="mab" style="display:none"></div>
<div class="r"><div><label>क्रमांक</label><input id="no" placeholder="प्रवर्तन/2026/"></div>
<div><label>पत्र दिनांक</label><input id="dt" type="date"></div></div>
<label>निरीक्षक का नाम</label><select id="insp"></select>
<label>प्रति (नाम / पद)</label><input id="to" placeholder="श्री पवन कुमार गर्ग">
<label>संस्थान / स्थापना का नाम</label><input id="est">
<label>पता</label><input id="adr">
<div id="xe"></div><button type="button" id="xea" class="s" style="display:none;width:100%;margin:6px 0">+ एक और संस्थान जोड़ें</button>
<div class="r"><div><label>निरीक्षण दिनांक</label><input id="idt" type="date"></div>
<div><label>स्पष्टीकरण हेतु दिवस</label><input id="days" type="number" min="1"></div></div>
<div id="chips" style="display:flex;gap:6px;flex-wrap:wrap;margin:6px 0"><button type="button" class="s" data-d="3">3 दिन</button><button type="button" class="s" data-d="7">7 दिन</button><button type="button" class="s" data-d="10">10 दिन</button><button type="button" class="s" data-d="15">15 दिन</button><button type="button" class="s">Custom</button></div><div id="dueb" style="background:#e4eee8;color:#2f4f40;padding:10px;border-radius:10px;font-weight:700"></div>
<div id="secck"></div>
<label>उल्लंघित धाराएं / नियम (संपादन योग्य)</label><textarea id="sec"></textarea>
<div id="xc"></div><button type="button" id="xa" class="s" style="display:none;width:100%;margin-top:8px">+ एक और अधिनियम / नोटिस जोड़ें</button>
<label>संदर्भ (वैकल्पिक)</label><input id="ref" placeholder="इस कार्यालय का पत्र क्रमांक ... दिनांक ...">
<label>निरीक्षण स्थल / कार्य (वैकल्पिक, जैसे ब्रिज निर्माण कार्य)</label><input id="wk">
<div id="cof" style="display:none"><label>जवाब की स्थिति</label><select id="ctp"><option>जवाब नहीं दिया गया</option><option>जवाब दिया गया — अपूर्ण पाया गया</option><option>जवाब दिया गया — संतोषप्रद नहीं पाया गया</option></select><label>जवाब/प्रतिवेदन की दिनांक (जवाब दिया हो तो)</label><input id="crd" type="date"><label>न्यायालय में उपस्थिति की दिनांक *</label><input id="cdt" type="date"><label>न्यायालय</label><input id="cct"><label>समय</label><input id="ctm" value="प्रातः 11 बजे"></div>
<div id="rsf" style="display:none"><label>जवाब का प्रकार</label><select id="rtp"><option>पूर्ण पालन</option><option>आंशिक पालन</option><option>असंतोषजनक</option><option>पालन नहीं किया</option><option>अन्य</option></select><label>जवाब/पालन प्रतिवेदन का विवरण</label><textarea id="rdet"></textarea><label>अधिकारी की टिप्पणी / परीक्षण</label><textarea id="rrem"></textarea><label>शेष कमी / आवश्यक सुधार</label><div id="rck"></div><textarea id="rlack"></textarea><label>प्रस्तावित अगली कार्रवाई</label><textarea id="rnx"></textarea></div>
<div class="ck"><input type="checkbox" id="sm"><span>द्वितीय / अंतिम कारण बताओ सूचना पत्र</span></div>
<div class="ck"><input type="checkbox" id="np"><span>पूर्व प्रतिवेदन में पालन प्रतिवेदन नहीं दिया गया</span></div>
<label>प्रतिवेदन दिनांक (ऊपर वाला चुनने पर)</label><input id="rdt" type="date">
<label>अतिरिक्त टिप्पणी (वैकल्पिक, bold में)</label><input id="nt" placeholder="उपरोक्त प्रपत्रों के सत्यापन हेतु बेलेन्स शीट उपलब्ध करावे।">
<label>प्रतिलिपि (वैकल्पिक, पूरा text)</label><div id="ccw" style="display:flex;flex-direction:column;gap:6px;margin:4px 0"></div><button type="button" id="cca" class="s" style="width:100%;margin:6px 0">+ एक और प्रतिलिपि जोड़ें</button><textarea id="cc" placeholder="अधिष्ठाता, ... की ओर प्रेषित कर लेख है कि ..."></textarea>
<div class="ck"><input type="checkbox" id="att"><span>कार्यालय में उपस्थित होकर</span></div>
<div class="ck"><input type="checkbox" id="cmp"><span>समझौता शुल्क (प्रशमन) का नोट जोड़ें</span></div>
</div>
<button id="pvb" style="display:none;width:100%;margin:12px 0">👁 पूर्वावलोकन देखें</button>
<div class="b"><button id="pr">🖨 प्रिंट / PDF</button><button class="s" id="dl">⬇ Word (.doc)</button><button class="s" id="cp">📋 कॉपी</button></div>
<div id="p"></div>
</div>
<div id="bv"></div><div id="bar"><div style="display:flex;gap:8px"><button id="bed" class="s">✏ Edit</button><button id="bpdf" class="s">🖨 Generate PDF</button></div><button id="bis" style="width:100%;margin-top:8px"></button></div>
